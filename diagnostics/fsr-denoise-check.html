<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>FSR noise and edge regression</title>
<pre id="result">Running…</pre>
<script type="module">
import { FsrEngine } from '../src/engine/fsr-engine.js';
const source = Object.assign(document.createElement('canvas'), { width: 64, height: 64 });
const ctx = source.getContext('2d');
const image = ctx.createImageData(64,64);
let seed = 5921;
for(let y=0;y<64;y++) for(let x=0;x<64;x++) {
  seed = (Math.imul(seed,1664525)+1013904223)>>>0;
  const value = x===31 || x===32 ? 8 : 128 + ((seed>>>24)%25)-12;
  const i=(y*64+x)*4; image.data.set([value,value,value,255],i);
}
ctx.putImageData(image,0,0);
const canvas = document.createElement('canvas');
const engine = new FsrEngine();
const report = {};
try {
  for(const mode of ['off','balanced','strong']) {
    const settings = { model:'fsr1-spatial',preset:'performance',spatialDenoise:mode };
    if(!engine.renderer) await engine.initialize({canvas,video:source,settings});
    else await engine.updateSettings(settings,source);
    await engine.processFrame(source);
    const capture = Object.assign(document.createElement('canvas'), {width:canvas.width,height:canvas.height});
    const read = capture.getContext('2d',{willReadFrequently:true});
    read.drawImage(canvas,0,0);
    const output=read.getImageData(0,0,capture.width,capture.height).data;
    let squared=0, count=0, line=0, lines=0;
    for(let y=16;y<112;y++) for(let x=16;x<112;x++) {
      const value=output[(y*128+x)*4];
      if(x<48 || x>80) { squared+=(value-128)**2; count++; }
      if(x===63 || x===64) { line+=value;lines++; }
    }
    report[mode]={flatMse:squared/count,lineMean:line/lines};
  }
  if(report.strong.flatMse > report.off.flatMse*.5) throw new Error('Strong denoise must reduce flat-area noise MSE by at least 50%');
  if(report.strong.lineMean>20) throw new Error('Denoise blurred the dark line');
  if(report.balanced.flatMse>=report.off.flatMse) throw new Error('Balanced denoise did not reduce noise');
  document.querySelector('#result').textContent='PASS\n'+JSON.stringify(report,null,2);
} catch(error) { document.querySelector('#result').textContent='FAIL: '+error.message+'\n'+JSON.stringify(report,null,2); }
finally { await engine.destroy(); }
</script>
