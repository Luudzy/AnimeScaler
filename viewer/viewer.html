<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnimeScaler Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <main id="stage">
    <canvas id="output"></canvas>
    <canvas id="original" hidden></canvas>
    <video id="capture" muted autoplay playsinline></video>
    <section id="hud">
      <div class="brand">ANIMESCALER <span id="model-brand">MODELO 2×</span></div>
      <div id="status">Preparando captura…</div>
      <div id="metrics"></div>
    </section>
    <nav id="controls">
      <button id="back" title="Voltar 10 segundos">−10s</button>
      <button id="play" title="Play/Pause">Play/Pause</button>
      <button id="forward" title="Avançar 10 segundos">+10s</button>
      <button id="fullscreen" title="Tela cheia">Tela cheia</button>
      <button id="compare" disabled>Comparar</button>
      <button id="comparison-toggle" hidden>Mostrar original</button>
      <button id="info" aria-pressed="true" title="Mostrar/ocultar informações (I)">Info</button>
      <button id="close" title="Fechar viewer">Fechar</button>
    </nav>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
